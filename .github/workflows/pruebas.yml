# SPDX-License-Identifier: GPL-3.0-or-later
# Pasa las pruebas del plugin contra la versión actual de IngeCAD oficial.
name: pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # Linux and Windows (the users' platform): the tests without a screen.
    # This is NOT the installed IngeCAD on Windows: that smoke test is manual.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: IngeCAD oficial (ingelibre/ingecad)
        uses: actions/checkout@v4
        with:
          repository: ingelibre/ingecad
          path: ingecad-src
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bibliotecas del sistema para Qt sin pantalla
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Dependencias
        run: pip install -r ingecad-src/requirements.txt -r requirements-dev.txt
      - name: Pruebas
        env:
          INGECAD_SRC: ${{ github.workspace }}/ingecad-src
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q
